name: Validate plugin manifests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check Agent Plugins / Claude Code / Tessl manifest consistency
        run: bash scripts/validate-plugin-manifests.sh

      - name: Check public documentation links
        run: bash scripts/validate-doc-links.sh

      - name: Check skill file references stay inside their skill folder
        run: bash scripts/check-skill-links.sh

      - name: Check SKILL.md front matter against the Agent Skills limits
        run: bash scripts/check-skill-frontmatter.sh

      - name: Check the layer catalog against the layer.md of every layer skill
        run: bash scripts/check-layer-catalog.sh

      - name: Check the @UseCase annotation is identical in every layer test skill
        run: bash scripts/check-usecase-annotation.sh

      - name: Check the generate workflow catalogue against the skills on disk
        run: bash scripts/check-generate-catalogue.sh

      - name: Check copyright headers, LICENSE and NOTICE
        run: bash scripts/check-copyright-headers.sh

      - name: Check standalone plugin README link rewriting
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          repository_url="https://github.com/${{ github.repository }}"
          registry_url="https://tessl.io/registry/ai-unified-process"
          git_ref=$(git rev-parse HEAD)
          registry_links=0

          for plugin_path in aiup-*/; do
            plugin=${plugin_path%/}
            cp -R "$plugin" "$tmp/$plugin"
            bash scripts/rewrite-plugin-readme-links.sh "$tmp/$plugin" "$repository_url" "$git_ref"

            # Scope the legacy-domain guard to the transformed README files that
            # are actually published. Documentation may mention it as a warning.
            if grep -q 'registry\.tessl\.io' "$tmp/$plugin/README.md"; then
              echo "ERROR: legacy Tessl registry domain in transformed README: $plugin" >&2
              exit 1
            fi

            while IFS= read -r url; do
              package=${url#"$registry_url/"}
              if [ "$package" = "$url" ] || [ ! -d "$package" ]; then
                echo "ERROR: registry URL has no sibling plugin directory: $url" >&2
                exit 1
              fi
              registry_links=$((registry_links + 1))
            done < <(grep -o "${registry_url}/[^)]*" "$tmp/$plugin/README.md")

            while IFS= read -r url; do
              relative=${url#"$repository_url/blob/$git_ref/"}
              if [ "$relative" = "$url" ]; then
                relative=${url#"$repository_url/tree/$git_ref/"}
                if [ "$relative" = "$url" ]; then
                  echo "ERROR: unexpected rewritten URL: $url" >&2
                  exit 1
                fi
              fi

              relative=${relative%%#*}
              if [ ! -e "$relative" ]; then
                echo "ERROR: rewritten URL has no repository target: $url" >&2
                exit 1
              fi
            done < <(grep -o "${repository_url}/[^)]*" "$tmp/$plugin/README.md")
          done

          if [ "$registry_links" -eq 0 ]; then
            echo "ERROR: sibling-plugin registry rewrite was not exercised" >&2
            exit 1
          fi

      - name: Check use case spec validator and worked example
        run: |
          python3 aiup-core/skills/use-case-spec/scripts/validate_use_case.py --self-test
          python3 aiup-core/skills/use-case-spec/scripts/validate_use_case.py --strict \
            aiup-core/skills/use-case-spec/references/example.md

      - name: Check BPMN path enumerator and example process
        run: |
          # The BPMN references ship as Markdown (Tessl publishes only .md and .py files from a skill);
          # extract the XML of the code block before handing it to the scripts.
          extract() { awk '/^```xml$/{f=1;next} /^```$/{f=0} f' "$1" > "$2"; }
          extract aiup-core/skills/test-case/references/example-process.bpmn.md "$RUNNER_TEMP/example-process.bpmn"
          python3 aiup-core/skills/test-case/scripts/bpmn_paths.py --self-test
          python3 aiup-core/skills/test-case/scripts/bpmn_paths.py "$RUNNER_TEMP/example-process.bpmn" > /dev/null

      - name: Check BPMN layout script and example process
        run: |
          extract() { awk '/^```xml$/{f=1;next} /^```$/{f=0} f' "$1" > "$2"; }
          extract aiup-core/skills/business-process/references/example.bpmn.md "$RUNNER_TEMP/example.bpmn"
          extract aiup-core/skills/business-process/references/process.bpmn.md "$RUNNER_TEMP/process.bpmn"
          python3 aiup-core/skills/business-process/scripts/bpmn_layout.py --self-test
          python3 aiup-core/skills/business-process/scripts/bpmn_layout.py --check "$RUNNER_TEMP/example.bpmn"
          python3 aiup-core/skills/test-case/scripts/bpmn_paths.py "$RUNNER_TEMP/example.bpmn" > /dev/null
          python3 aiup-core/skills/test-case/scripts/bpmn_paths.py "$RUNNER_TEMP/process.bpmn" > /dev/null

      - name: Check spec linter and eval fixtures
        run: |
          # layer-skill and agent fixtures of the scenarios must be copies of the real files
          scripts/sync-eval-fixtures.sh --check
          python3 aiup-core/skills/spec-review/scripts/spec_lint.py --self-test
          python3 aiup-core/skills/user-guide/scripts/guide_anchor.py --self-test
          # the user-guide scenarios seed one anchored section per state; their rubrics quote the hashes
          for scenario in keeps-team-sections hand-edit-vs-spec-change; do
            (cd "aiup-core/evals/user-guide-$scenario/inputs" \
              && python3 ../../../skills/user-guide/scripts/guide_anchor.py check | awk '{print $2, $3}' \
              > "$RUNNER_TEMP/states-$scenario.txt")
          done
          printf 'UC-001 unchanged\nUC-002 spec-changed\nUC-004 unchanged\n' \
            | diff - "$RUNNER_TEMP/states-keeps-team-sections.txt"
          printf 'UC-001 unchanged\nUC-002 spec-changed\nUC-004 edited\n' \
            | diff - "$RUNNER_TEMP/states-hand-edit-vs-spec-change.txt"
          # spec-review-lint-and-semantic seeds defects on purpose: the lint must fail on it
          if python3 aiup-core/skills/spec-review/scripts/spec_lint.py \
              --docs aiup-core/evals/spec-review-lint-and-semantic/docs > /dev/null; then
            echo "ERROR: spec_lint.py found no errors in the seeded spec-review-lint-and-semantic fixture" >&2
            exit 1
          fi
