# AI Unified Process Studio - AI-assisted generation, the shared implementation.
#
# This is the reusable workflow behind the dispatch stub the AI Unified Process Studio writes into
# every repository it sets up (UC-042). The stub receives the workflow_dispatch and
# calls this workflow by tag; everything the run does - the specification diff, the
# skill, the status advance and the pull request - happens here. Evolving this file and
# moving the tag updates every repository at once; the stubs stay as they are. How the
# v1 tag works and how to move it: docs/generate-workflow-versioning.md.
#
# It runs the chosen skill of the chosen plugin and provides the result as a pull
# request; nothing is ever written to a branch directly. The one exception is
# spec-review, which changes nothing: its report goes to the Studio through the log of
# the run instead (step "Hand the review over to the Studio").
name: AI Unified Process Generate

on:
  workflow_call:
    inputs:
      plugin:
        description: Plugin the skill belongs to
        required: true
        type: string
      skill:
        description: Skill to run
        required: true
        type: string
      subject:
        description: Artifact or use case id the skill applies to
        required: false
        type: string
      artifact_locations:
        # Empty while the repository keeps the AI Unified Process default paths; the
        # Studio fills it with a prompt-ready hint naming the configured locations
        # otherwise (UC-033 BR-008). The revision of a specification with the findings
        # of a review travels here as well (UC-035 BR-004): the input reaches the prompt
        # as it stands, and a new input would make the stub of every repository outdated.
        description: Where the artifacts lie when the repository deviates from the defaults
        required: false
        default: ""
        type: string
      correlation_id:
        description: Id of the run from the Studio
        required: true
        type: string
      model:
        description: Model Claude Code runs with
        required: false
        default: claude-sonnet-5
        type: string
      max_turns:
        description: Upper limit of turns in Claude Code
        required: false
        default: "40"
        type: string
      timeout_minutes:
        description: Upper limit of the run time in minutes
        required: false
        default: "30"
        type: string
    # Declared instead of `secrets: inherit`: GitHub only inherits secrets when caller
    # and called workflow live in the same organization, and the project repositories
    # live anywhere. A declared secret arrives from every caller. Both stay optional
    # because one of the two is enough.
    secrets:
      ANTHROPIC_API_KEY:
        description: API key from the Anthropic Console
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Token from `claude setup-token` of a Claude subscription
        required: false
      AIUP_PR_TOKEN:
        # GitHub starts no workflow for a pull request opened with GITHUB_TOKEN, so without this secret the
        # project's CI does not run on the result. A fine-grained personal access token or a GitHub App token with
        # Contents and Pull requests write; the steps are in docs/werkstatt.md, "CI on the pull request".
        description: Token that opens the pull request, so that the project's CI runs on it (optional)
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # After this, a run without a result counts as failed. The Studio applies the same
    # deadline, so the run stops costing at the moment the Studio gives up on it.
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    steps:
      # The stub accepts plugin and skill as free text so that a new skill does not
      # force an update of every repository. The guarantee its former choice lists gave
      # moves here: only a combination of this catalogue reaches a prompt. The
      # catalogue mirrors the plugins of this marketplace - the name alone would not
      # do, because implement and playwright-test exist in several stack plugins and
      # mean different work in each - and a new skill changes it in the same pull
      # request that adds the skill. Read-only skills (the coverage audits) are left
      # out: a run that changes nothing has no pull request to open. spec-review is the
      # exception, because the Studio reads its report from the log of the run.
      # It is the same list as in pipelines/aiup-generate.sh; scripts/check-generate-catalogue.sh
      # fails CI when the two differ or a skill on disk is in neither.
      - name: Check the plugin and the skill against the catalogue
        env:
          # through the environment, not into the script: both values are free text
          PLUGIN: ${{ inputs.plugin }}
          SKILL: ${{ inputs.skill }}
        run: |
          set -euo pipefail
          case "$PLUGIN/$SKILL" in
            aiup-core/requirements) ;;
            aiup-core/entity-model) ;;
            aiup-core/use-case-diagram) ;;
            aiup-core/business-process) ;;
            aiup-core/use-case-spec) ;;
            aiup-core/test-case) ;;
            aiup-core/reverse-engineer) ;;
            aiup-core/stack) ;;
            aiup-core/spec-review) ;;
            aiup-vaadin-jooq/flyway-migration) ;;
            aiup-vaadin-jooq/implement) ;;
            aiup-vaadin-jooq/implement-hilla) ;;
            aiup-vaadin-jooq/browserless-test) ;;
            aiup-vaadin-jooq/hilla-test) ;;
            aiup-vaadin-jooq/playwright-test) ;;
            aiup-angular-jpa/flyway-migration) ;;
            aiup-angular-jpa/implement) ;;
            aiup-angular-jpa/spring-boot-test) ;;
            aiup-angular-jpa/vitest-test) ;;
            aiup-angular-jpa/playwright-test) ;;
            aiup-blazor-dotnet/ef-migration) ;;
            aiup-blazor-dotnet/implement) ;;
            aiup-blazor-dotnet/dotnet-test) ;;
            aiup-blazor-dotnet/bunit-test) ;;
            aiup-blazor-dotnet/playwright-test) ;;
            aiup-nestjs-nextjs/drizzle-migration) ;;
            aiup-nestjs-nextjs/implement) ;;
            aiup-nestjs-nextjs/nest-test) ;;
            aiup-nestjs-nextjs/react-test) ;;
            aiup-nestjs-nextjs/playwright-test) ;;
            aiup-core/use-case-implement) ;;
            aiup-core/use-case-test) ;;
            aiup-core/test-case-implement) ;;
            aiup-flyway/flyway-schema) ;;
            aiup-jooq/jooq-persistence) ;;
            aiup-jooq/jooq-persistence-test) ;;
            aiup-jpa/jpa-persistence) ;;
            aiup-jpa/jpa-persistence-test) ;;
            aiup-spring-boot/spring-service) ;;
            aiup-spring-boot/spring-rest) ;;
            aiup-spring-boot/spring-service-test) ;;
            aiup-spring-boot/spring-rest-test) ;;
            aiup-spring-boot/spring-client) ;;
            aiup-spring-boot/spring-client-test) ;;
            aiup-vaadin/vaadin-flow-ui) ;;
            aiup-vaadin/hilla-ui) ;;
            aiup-vaadin/vaadin-flow-ui-test) ;;
            aiup-vaadin/hilla-ui-test) ;;
            aiup-vaadin/vaadin-e2e-test) ;;
            aiup-angular/angular-ui) ;;
            aiup-angular/angular-ui-test) ;;
            aiup-playwright/playwright-e2e-test) ;;
            aiup-drizzle/drizzle-schema) ;;
            aiup-drizzle/drizzle-persistence) ;;
            aiup-drizzle/drizzle-persistence-test) ;;
            aiup-nestjs/nest-service) ;;
            aiup-nestjs/nest-service-test) ;;
            aiup-nestjs/nest-rest) ;;
            aiup-nestjs/nest-rest-test) ;;
            aiup-nextjs/nextjs-ui) ;;
            aiup-nextjs/nextjs-ui-test) ;;
            *)
              echo "::error::'$SKILL' of '$PLUGIN' is not in the catalogue of this marketplace"
              exit 1 ;;
          esac

      # The token of the job is not left in .git/config: the session runs with bypassed permissions,
      # and the deny rule on git stops the tool, not a build script or `env git push`. The one step
      # that fetches passes the token for that call alone; the pull request step has its own.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Only aiup-core and the plugins this run needs are installed; the selection reads the
      # stack file of the checked-out repository, so it runs after the checkout.
      - name: Select the plugins
        id: plugins
        env:
          # through the environment, not into the script: both values are free text
          PLUGIN: ${{ inputs.plugin }}
          SKILL: ${{ inputs.skill }}
        run: |
          set -euo pipefail
          # >>> plugin selection - identical in pipelines/aiup-generate.sh and .github/workflows/aiup-generate.yml
          # A project uses either layer plugins or one combined stack plugin, never both: commands
          # such as /implement exist in several stack plugins, and a layer project whose session also
          # holds a combined plugin runs the wrong skill. So only aiup-core and the plugins the run
          # needs are installed. A combined stack plugin brings everything itself. A layer run takes
          # the layer plugins that the project's stack file names in its Layers table, plus the
          # chosen plugin; without a stack file (and always for /stack, which discovers
          # the installed layer skills to choose from) it takes every layer plugin, still without the
          # combined ones. The document skills of aiup-core need nothing but core. The skills of each
          # layer plugin are listed here because the Layers table names skills, not plugins;
          # scripts/check-generate-catalogue.sh keeps this list in step with the skills on disk.
          layer_skills="aiup-flyway:flyway-schema
          aiup-jooq:jooq-persistence aiup-jooq:jooq-persistence-test
          aiup-jpa:jpa-persistence aiup-jpa:jpa-persistence-test
          aiup-spring-boot:spring-service aiup-spring-boot:spring-service-test aiup-spring-boot:spring-rest aiup-spring-boot:spring-rest-test aiup-spring-boot:spring-client aiup-spring-boot:spring-client-test
          aiup-vaadin:vaadin-flow-ui aiup-vaadin:vaadin-flow-ui-test aiup-vaadin:hilla-ui aiup-vaadin:hilla-ui-test aiup-vaadin:vaadin-e2e-test
          aiup-angular:angular-ui aiup-angular:angular-ui-test
          aiup-drizzle:drizzle-schema aiup-drizzle:drizzle-persistence aiup-drizzle:drizzle-persistence-test
          aiup-nestjs:nest-service aiup-nestjs:nest-service-test aiup-nestjs:nest-rest aiup-nestjs:nest-rest-test
          aiup-nextjs:nextjs-ui aiup-nextjs:nextjs-ui-test
          aiup-playwright:playwright-e2e-test"
          view=docs/architecture/stack.md
          all_layers=""
          from_view=""
          for pair in $layer_skills; do
            layer_plugin=${pair%%:*}
            layer_skill=${pair#*:}
            case " $all_layers " in *" $layer_plugin "*) ;; *) all_layers="$all_layers $layer_plugin" ;; esac
            # A table row that names the skill: in backticks anywhere in the row, or bare as a whole cell -
            # /stack writes the Layers table bare and the Integration layer table in backticks.
            if [ -f "$view" ] && grep -Eq "^\|.*(\`$layer_skill\`|\|[[:space:]]*$layer_skill[[:space:]]*\|)" "$view"; then
              case " $from_view " in *" $layer_plugin "*) ;; *) from_view="$from_view $layer_plugin" ;; esac
            fi
          done
          case "$PLUGIN/$SKILL" in
            aiup-vaadin-jooq/* | aiup-angular-jpa/* | aiup-blazor-dotnet/* | aiup-nestjs-nextjs/*)
              plugins="aiup-core $PLUGIN" ;;
            aiup-core/stack)
              plugins="aiup-core$all_layers" ;;
            aiup-core/use-case-implement | aiup-core/use-case-test | aiup-core/test-case-implement)
              if [ -n "$from_view" ]; then plugins="aiup-core$from_view"; else plugins="aiup-core$all_layers"; fi ;;
            aiup-core/*)
              plugins="aiup-core" ;;
            *)
              if [ -n "$from_view" ]; then
                plugins="aiup-core$from_view"
                case " $plugins " in *" $PLUGIN "*) ;; *) plugins="$plugins $PLUGIN" ;; esac
              else
                plugins="aiup-core$all_layers"
              fi ;;
          esac
          echo "Plugins for $PLUGIN/$SKILL: $plugins"
          # <<< plugin selection
          {
            echo "list<<AI-UNIFIED-PROCESS-PLUGINS-$GITHUB_SHA"
            for plugin in $plugins; do
              echo "$plugin@ai-unified-process-marketplace"
            done
            echo "AI-UNIFIED-PROCESS-PLUGINS-$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      # spec-review (UC-062 of the Studio) changes nothing, so it opens no pull request
      # and hands its report over through the log. A subject that starts with `lint`
      # asks for the deterministic part alone, which needs no AI access at all; the rest
      # of the subject is the scope - one use case or test case id, or empty for the
      # whole project.
      - name: Determine the kind of the run
        id: mode
        env:
          SKILL: ${{ inputs.skill }}
          # through the environment, not into the script: the subject is free text
          SUBJECT: ${{ inputs.subject }}
        run: |
          set -euo pipefail
          review=false
          lint_only=false
          scope=""
          arguments=""
          case "$SKILL" in
            spec-review)
              review=true
              scope=$SUBJECT
              if [ "$scope" = lint ] || [ "${scope#lint }" != "$scope" ]; then
                lint_only=true
                scope=${scope#lint}
                scope=${scope# }
              fi
              # The scope reaches the prompt and the lint; nothing but an id may stand there.
              if [ -n "$scope" ] && ! printf '%s' "$scope" | grep -Eq '^([SB]?UC|TC)-[A-Za-z0-9_-]+$'; then
                echo "::error::'$scope' is no use case or test case id"
                exit 1
              fi
              arguments="--output .aiup-report/review.json" ;;
          esac
          {
            echo "review=$review"
            echo "lint_only=$lint_only"
            echo "scope=$scope"
            echo "arguments=$arguments"
          } >> "$GITHUB_OUTPUT"

      # A specification edit that only removes a requirement is invisible to the skill:
      # the remaining text is already satisfied by the existing code, so the run finds
      # nothing to do and the dropped behaviour survives. The diff since the branch left
      # the default branch makes every change explicit - removals included - and travels with the
      # prompt so the skill reconciles the code with the change instead of re-checking
      # a specification it already fulfils.
      - name: Determine the change of the specification
        id: spec_change
        if: inputs.subject != ''
        env:
          SKILL: ${{ inputs.skill }}
          # through the environment, not into the script: the subject is free text
          SUBJECT: ${{ inputs.subject }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only the skills that turn a specification into code or tests care how the
          # specification moved; the document skills rewrite their artifact as a whole.
          case "$SKILL" in
            implement | implement-hilla | browserless-test | hilla-test | spring-boot-test | vitest-test | dotnet-test | bunit-test | nest-test | react-test | playwright-test \
              | use-case-implement | use-case-test | test-case-implement \
              | flyway-schema | jooq-persistence | jooq-persistence-test | jpa-persistence | jpa-persistence-test | spring-service | spring-service-test | spring-rest | spring-rest-test | spring-client | spring-client-test | vaadin-flow-ui | vaadin-flow-ui-test | hilla-ui | hilla-ui-test | angular-ui | angular-ui-test | drizzle-schema | drizzle-persistence | drizzle-persistence-test | nest-service | nest-service-test | nest-rest | nest-rest-test | nextjs-ui | nextjs-ui-test | vaadin-e2e-test | playwright-e2e-test) ;;
            *) exit 0 ;;
          esac
          # The subject of these skills is the path of the specification. A subject that
          # is an id names no file and has no history to diff.
          if [ ! -f "$SUBJECT" ]; then
            exit 0
          fi
          # The checkout keeps no credentials (step "Check out the repository"), so the fetches of
          # this step carry the token of the job themselves - through the environment of this
          # step only, nothing is written to .git/config. FETCH_HEAD instead of a remote ref
          # because actions/checkout narrows the fetch refspec to the dispatched ref.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_VALUE_0
          default_branch=$DEFAULT_BRANCH
          head_ref=$GITHUB_REF
          # >>> specification diff - identical in pipelines/aiup-generate.sh and .github/workflows/aiup-generate.yml
          # Against the merge base, not the tip of the default branch: a change the default branch made to the
          # same specification after this branch was cut would read as lines this branch removed, and the
          # prompt tells the skill to delete the code of a removed line. The clone is shallow on both hosts, so
          # both histories are deepened until they meet; without a common commit there is no diff and no hint.
          diff=""
          base=""
          for depth in 50 500 5000; do
            # a fetch that fails costs the hint, not the run: git says why in the log. No maintenance in the
            # background: it would hold the lock on the shallow file while the next fetch deepens.
            if git -c gc.auto=0 -c maintenance.auto=false fetch --quiet --depth="$depth" origin "refs/heads/$default_branch"; then
              default_tip=$(git rev-parse FETCH_HEAD)
              if [ -n "$head_ref" ]; then
                git -c gc.auto=0 -c maintenance.auto=false fetch --quiet --depth="$depth" origin "$head_ref" || true
              fi
              base=$(git merge-base "$default_tip" HEAD 2>/dev/null || true)
            fi
            if [ -n "$base" ]; then
              break
            fi
          done
          if [ -n "$base" ]; then
            diff=$(git diff "$base" HEAD -- "$SUBJECT")
          fi
          # <<< specification diff
          if [ -z "$base" ]; then
            echo "This branch and \`$DEFAULT_BRANCH\` share no commit within reach; the run works from the specification alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$diff" ]; then
            echo "The specification is unchanged since this branch left \`$DEFAULT_BRANCH\`; the run works from the specification alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A diff of a single specification is small. Anything larger is not a
          # specification edit and would drown the prompt - better no hint than a
          # truncated one that misleads.
          if [ "${#diff}" -gt 20000 ]; then
            echo "The diff of \`$SUBJECT\` is too large for the prompt; the run works from the specification alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The delimiter carries the commit id, so no line of the diff can match it.
          # Tildes fence the diff because a Markdown specification may itself contain
          # backtick fences.
          {
            echo "hint<<AI-UNIFIED-PROCESS-DIFF-$GITHUB_SHA"
            echo ""
            echo "The specification named above was changed on this branch. Its diff since the branch left \`$DEFAULT_BRANCH\`:"
            echo ""
            echo '~~~diff'
            printf '%s\n' "$diff"
            echo '~~~'
            echo ""
            echo "Reconcile the result with every change in this diff, not only with the current text of the specification. A removed line means the behaviour it described was dropped deliberately: delete the code or tests that exist only for that behaviour."
            echo "AI-UNIFIED-PROCESS-DIFF-$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Run the skill
        # the lint alone needs no session (step "Determine the kind of the run")
        if: steps.mode.outputs.lint_only != 'true'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1
        with:
          # Two ways to the AI access, one of them is enough: an API key from the
          # Anthropic Console or - with a Claude subscription - the token from
          # `claude setup-token`. The secrets live in the calling repository and are
          # passed explicitly by the stub; whichever is not set stays empty and is
          # ignored by the action.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The Studio dispatches the workflow with the token of its GitHub App, so the
          # actor is a bot (`aiup-studio[bot]`, or whatever the app of a self-hosted
          # Studio is called) and the action would refuse to start. The name of the app
          # is not fixed, hence every bot is allowed: the only trigger is
          # workflow_dispatch, and GitHub grants that to write access only.
          allowed_bots: "*"
          plugin_marketplaces: https://github.com/AI-Unified-Process/marketplace.git
          # aiup-core and the plugins the step "Select the plugins" chose, one per line.
          plugins: ${{ steps.plugins.outputs.list }}
          # The artifact locations and the diff of the specification follow the slash
          # command; empty values leave the prompt as the bare command. Everything
          # after the command name reaches the skill as its arguments, and the skills
          # expect the hints there. Plugin and skill were checked against the catalogue
          # above; nothing else ever stands before the colon or the space.
          prompt: |
            /${{ inputs.plugin }}:${{ inputs.skill }} ${{ inputs.subject }} ${{ steps.mode.outputs.arguments }}
            ${{ inputs.artifact_locations }}
            ${{ steps.spec_change.outputs.hint }}
          # The permission mode has to be set here: the action only grants it in its tag
          # mode (@claude in a comment), and a workflow_dispatch run is its agent mode,
          # where nothing but these arguments applies. Without it the skill is allowed to
          # read but not to write, and the run ends successfully without a single changed
          # file. Bypassing rather than accepting the edits because the code and test
          # skills verify their result with Maven, and that is a Bash call.
          #
          # git stays blocked: the changes are meant to stay in the working directory so
          # that the next step can turn them into a pull request. The deny rule outranks
          # the permission mode, so the block holds.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --permission-mode bypassPermissions
            --disallowedTools Bash(git:*)

      # The report of spec-review: the lint runs here and not in the session, so its
      # findings never pass through a model, and the semantic part is the JSON the
      # skill wrote (its section "Machine-Readable Result"). The Studio reads the block
      # between the markers from the log of the run - the one channel GitHub and
      # Bitbucket both offer without a token of the run's own - and takes the last block
      # that carries its correlation id. Base64 keeps the payload on lines that neither
      # GitHub nor anything the session printed can be mistaken for.
      - name: Hand the review over to the Studio
        if: steps.mode.outputs.review == 'true'
        env:
          SCOPE: ${{ steps.mode.outputs.scope }}
          LINT_ONLY: ${{ steps.mode.outputs.lint_only }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          set -euo pipefail
          # >>> review report - identical in pipelines/aiup-generate.sh and .github/workflows/aiup-generate.yml
          # The lint comes from the published aiup-core, the version the session installs too.
          marketplace=$(mktemp -d)
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/AI-Unified-Process/marketplace.git "$marketplace"
          git -C "$marketplace" sparse-checkout set aiup-core/skills
          lint="$marketplace/aiup-core/skills/spec-review/scripts/spec_lint.py"
          mkdir -p .aiup-report
          set +e
          if [ -n "$SCOPE" ]; then
            python3 "$lint" --docs docs --format json --only "$SCOPE" > .aiup-report/lint.json
          else
            python3 "$lint" --docs docs --format json > .aiup-report/lint.json
          fi
          lint_status=$?
          set -e
          # 1 only says that the lint found errors - a result of the review, not a failure of the run
          if [ "$lint_status" -gt 1 ]; then
            echo "spec_lint.py failed with exit code $lint_status" >&2
            exit 1
          fi
          mode=full
          if [ "$LINT_ONLY" = true ]; then
            mode=lint
          fi
          python3 - "$mode" "$SCOPE" > .aiup-report/report.json <<'PY'
          import json, os, sys
          mode, scope = sys.argv[1], sys.argv[2]
          with open(".aiup-report/lint.json", encoding="utf-8") as f:
              lint = json.load(f)
          semantic = None
          # a semantic part the session did not write, or wrote broken, is reported as missing
          if mode == "full" and os.path.isfile(".aiup-report/review.json"):
              try:
                  with open(".aiup-report/review.json", encoding="utf-8") as f:
                      semantic = json.load(f)
              except ValueError:
                  semantic = None
          json.dump({"format": 1, "mode": mode, "scope": scope, "lint": lint, "semantic": semantic}, sys.stdout,
                    ensure_ascii=False)
          PY
          echo "AIUP-REPORT-BEGIN $CORRELATION_ID"
          base64 < .aiup-report/report.json | fold -w 76
          echo "AIUP-REPORT-END $CORRELATION_ID"
          # <<< review report

      # The status of the specification follows the merge: the new status travels in the
      # same pull request as the code it describes, so the artifact says Implemented or
      # Tested at the very moment the proposal is taken over
      # - and says nothing new while the pull request is only open or is rejected. Nobody
      # has to watch the pull request afterwards and no second commit follows the merge.
      - name: Advance the status of the specification
        if: inputs.subject != ''
        env:
          SKILL: ${{ inputs.skill }}
          # through the environment, not into the script: the subject is free text
          SUBJECT: ${{ inputs.subject }}
        run: |
          set -euo pipefail
          # Only the steps that move the status of a use case. The end-to-end test
          # follows a test case, not a use case, and moves nothing; neither does a layer
          # skill run on its own, because one layer does not make a use case Implemented.
          case "$SKILL" in
            implement | implement-hilla | use-case-implement)
              target=3; english=Implemented; german=Implementiert ;;
            browserless-test | hilla-test | spring-boot-test | vitest-test | dotnet-test | bunit-test | nest-test | react-test | use-case-test)
              target=4; english=Tested; german=Getestet ;;
            *)
              exit 0 ;;
          esac
          # The subject of these steps is the path of the specification. A subject that
          # is an id names no file and is left alone.
          if [ ! -f "$SUBJECT" ]; then
            echo "No specification at \`$SUBJECT\`; the status was left alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A run that produced nothing has no result to take over; without this check the
          # pull request would carry the new status and nothing else.
          if [ -z "$(git status --porcelain)" ]; then
            echo "The skill changed nothing; the status was left alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The question log alone is no result.
          if [ -z "$(git status --porcelain -- . ':(exclude)docs/open_questions.md')" ]; then
            echo "The skill only recorded open questions; the status was left alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          uc=$(sed -n -e 's/^\*\*Use[ -]Case[ -]ID:\*\*[[:space:]]*\([^[:space:]]*\).*/\1/p' "$SUBJECT" | head -n 1)
          # >>> blocking questions - identical in pipelines/aiup-generate.sh and .github/workflows/aiup-generate.yml
          # A skill that stopped on a gap of the specification recorded an open question and built nothing,
          # or not everything: a use case a blocking question holds is not Implemented or Tested. The
          # questions are read by spec_lint.py itself (OQ_BLOCKING), from the published aiup-core the
          # session installs too, so this step and the lint cannot disagree: a question on a requirement the
          # use case links counts, a section inside a fenced example does not. When the lint cannot be run,
          # the status stays as it is - a status set too early fails the lint of the pull request.
          blocking=""
          if [ -n "$uc" ] && [ -f docs/open_questions.md ]; then
            questions=$(mktemp -d)
            lint="$questions/marketplace/aiup-core/skills/spec-review/scripts/spec_lint.py"
            if git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/AI-Unified-Process/marketplace.git "$questions/marketplace" \
                && git -C "$questions/marketplace" sparse-checkout set aiup-core/skills; then
              lint_status=0
              python3 "$lint" --docs docs --no-baseline --format json --only "$uc" > "$questions/lint.json" || lint_status=$?
              # 1 only says that the lint found errors
              if [ "$lint_status" -gt 1 ]; then
                blocking="not known: spec_lint.py failed with exit code $lint_status"
              else
                # one line: the block is indented differently in the two files, and Python minds
                blocking=$(python3 -c 'import json, re, sys; print(" ".join(dict.fromkeys(q for f in json.load(open(sys.argv[1], encoding="utf-8"))["findings"] if f["code"] == "OQ_BLOCKING" for q in re.findall(r"blocking question (OQ-[A-Za-z0-9_-]+)", f["message"]))))' "$questions/lint.json") \
                  || blocking="not known: the result of spec_lint.py could not be read"
              fi
            else
              blocking="not known: the marketplace with spec_lint.py could not be cloned"
            fi
          fi
          # <<< blocking questions
          if [ -n "$blocking" ]; then
            echo "Blocking open questions on $uc ($blocking); the status was left alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # >>> status rank - identical in pipelines/aiup-generate.sh and .github/workflows/aiup-generate.yml
          current=$(sed -n -e 's/^\*\*Status:\*\*[[:space:]]*\([^[:space:]]*\).*/\1/p' \
            -e '/^\*\*Status:\*\*/q' "$SUBJECT")
          # The AI Unified Process status values in their order, English and German.
          # LC_ALL=C keeps the lowercasing to ASCII, so the umlaut of "Geprüft" survives.
          case "$(printf '%s' "$current" | LC_ALL=C tr '[:upper:]' '[:lower:]')" in
            draft | entwurf) rank=0 ;;
            reviewed | geprüft) rank=1 ;;
            approved | genehmigt) rank=2 ;;
            implemented | implementiert) rank=3 ;;
            tested | getestet) rank=4 ;;
            done | abgeschlossen) rank=5 ;;
            # Obsolete, a value the format does not know, or no status line at all: none of them is a
            # state this run may advance out of.
            *) rank=-1 ;;
          esac
          # Forward only, and only out of a status the step is allowed at: below Approved neither the
          # implementation nor the tests are a step of the AI Unified Process, and a status already at or
          # beyond the one this run stands for never moves backwards.
          advance=true
          if [ "$rank" -lt 2 ] || [ "$rank" -ge "$target" ]; then
            advance=false
          fi
          # <<< status rank
          if [ "$advance" != true ]; then
            echo "Status \`$current\` of \`$SUBJECT\` was left alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # >>> status write - identical in pipelines/aiup-generate.sh and .github/workflows/aiup-generate.yml
          # A specification is written back in the language it is written in.
          if grep -qE '^\*\*Use-Case-ID:\*\*|^## Übersicht' "$SUBJECT"; then
            value=$german
          else
            value=$english
          fi
          # Only the first status line and only its value: what follows it - the trailing spaces
          # of a Markdown hard break, a comment, a note - stays as it is.
          sed -i "0,/^\*\*Status:\*\*/s/^\(\*\*Status:\*\*\)[[:space:]]*[^[:space:]]*/\1 $value/" "$SUBJECT"
          # <<< status write
          echo "Status of \`$SUBJECT\`: $current -> $value" >> "$GITHUB_STEP_SUMMARY"

      # Title and description name the artifact the run was set on. The subject is not
      # decoration - without it the pull request reads as "AI Unified Process:
      # implement" next to every other one, and nobody can tell which change to which
      # use case led to which proposal.
      #
      # The branch keeps its shape `aiup/<skill>-<correlation id>`: the Studio rebuilds
      # that name to find the pull request of a run again, so the subject must not enter
      # it.
      - name: Provide the result as a pull request
        id: pr
        # spec-review proposes nothing; its report is in the log
        if: steps.mode.outputs.review != 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # GITHUB_TOKEN when the stub passes no AIUP_PR_TOKEN: the pull request is opened, but no CI runs on it.
          token: ${{ secrets.AIUP_PR_TOKEN || github.token }}
          branch: aiup/${{ inputs.skill }}-${{ inputs.correlation_id }}
          delete-branch: true
          # The subject is passed through as it stands - a path or an id, depending on the
          # skill. Parsing an id out of it would be guesswork: an AI Unified Process id may itself
          # carry hyphens, so `UC-007-place-an-order` cannot be split reliably.
          title: "${{ inputs.subject != '' && format('AI Unified Process: {0} {1}', inputs.skill, inputs.subject) || format('AI Unified Process: {0}', inputs.skill) }}"
          commit-message: "${{ inputs.subject != '' && format('AI Unified Process: {0} {1}', inputs.skill, inputs.subject) || format('AI Unified Process: {0}', inputs.skill) }}"
          body: |
            Generated by the AI Unified Process Studio with the skill `${{ inputs.plugin }}:${{ inputs.skill }}`.

            ${{ inputs.subject != '' && format('Basis: `{0}`', inputs.subject) || 'The skill works on the repository as a whole; there is no single basis artifact.' }}

            The content is a proposal and is to be reviewed before it is taken over.

            aiup-run: ${{ inputs.correlation_id }}

      - name: Summarise the result
        run: |
          if [ "${{ steps.mode.outputs.review }}" = true ]; then
            echo "The review was handed over to the Studio in the log of this run; no pull request was created." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ steps.pr.outputs.pull-request-number }}" ]; then
            echo "Pull request #${{ steps.pr.outputs.pull-request-number }}: ${{ steps.pr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The skill produced no changes; no pull request was created." >> "$GITHUB_STEP_SUMMARY"
          fi
