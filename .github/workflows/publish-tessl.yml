# Publishes the AI Unified Process plugins to the Tessl registry when they change.
#
# Each plugin is published only when the version in its
# .tessl-plugin/plugin.json has not already been published — so bump the
# version (e.g. `tessl version patch ./aiup-core`) as part of any change you
# want released. Pushes that touch a plugin without a version bump are skipped,
# not failed.
#
# Each plugin's evals/ directory (committed scenarios) is published with it and
# drives a publish-time eval that produces the registry Impact score. Regenerate
# scenarios with `tessl scenario generate ./<plugin> --workspace ai-unified-process` and
# `tessl scenario download --last`, then commit the evals/ changes.
#
# After the publish step, each plugin whose current version has no GitHub release yet gets one:
# tag <plugin>-v<version> on the commit that set the version, notes from
# scripts/release-notes.sh (the plugin's commits since the previous version). A run
# via workflow_dispatch creates any release that is still missing.
#
# One-time setup:
#   1. Create an API key in the Tessl Web UI (workspace settings → API keys).
#   2. Add it as a repo secret named TESSL_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret).
name: Publish to Tessl

on:
  push:
    branches: [main]
    paths:
      - 'aiup-core/**'
      - 'aiup-vaadin-jooq/**'
      - 'aiup-angular-jpa/**'
      - 'aiup-blazor-dotnet/**'
      - 'aiup-nestjs-nextjs/**'
      - '.github/workflows/publish-tessl.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    strategy:
      fail-fast: false
      matrix:
        plugin: [aiup-core, aiup-vaadin-jooq, aiup-angular-jpa, aiup-blazor-dotnet, aiup-nestjs-nextjs]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # release notes need the plugin's history since its previous version

      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Rewrite marketplace-relative README links for the published package
        run: |
          bash scripts/rewrite-plugin-readme-links.sh \
            "${{ matrix.plugin }}" \
            "https://github.com/${{ github.repository }}" \
            "${{ github.sha }}"

      - name: Publish ${{ matrix.plugin }} if its version is new
        run: |
          set -euo pipefail
          dir="${{ matrix.plugin }}"

          # Dry-run gates the real publish:
          #   exit 0            -> version is new, publish it
          #   "already exists"  -> nothing to release, skip cleanly
          #   any other failure -> real error, fail the job
          set +e
          out=$(tessl plugin publish --dry-run "./$dir" 2>&1)
          code=$?
          set -e
          echo "$out"

          if [ "$code" -eq 0 ]; then
            echo "::notice::Publishing $dir"
            # Publishes the committed evals/ scenarios and runs a publish-time
            # eval to attach the Impact score. --with-scenario-quality-check
            # drops misleading/errored scenarios so a single empty agent run
            # can't tank the average.
            tessl plugin publish "./$dir"
          elif echo "$out" | grep -q "already exists"; then
            echo "::notice::$dir version already published — skipping"
          else
            echo "::error::Pre-publish checks failed for $dir"
            exit 1
          fi

      - name: Create the GitHub release of ${{ matrix.plugin }} if it is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plugin="${{ matrix.plugin }}"
          read -r tag commit < <(scripts/release-notes.sh "$plugin" --tag)

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists — skipping"
            exit 0
          fi

          scripts/release-notes.sh "$plugin" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$commit" \
            --title "$plugin ${tag#"$plugin-v"}" --notes-file "$RUNNER_TEMP/notes.md"
