# Publishes the AI Unified Process plugins to the Tessl registry when they change.
#
# Each plugin is published only when the version in its
# .tessl-plugin/plugin.json has not already been published — so bump the
# version (e.g. `tessl version patch ./aiup-core`) as part of any change you
# want released. Pushes that touch a plugin without a version bump are skipped,
# not failed.
#
# Each plugin's scenarios live in evals/<plugin>/ at the repository root, outside the plugin folder, because
# the Claude directory submits the plugin folder alone and refuses the fixtures in it. They are published only
# when the repository variable TESSL_PUBLISH_EVALS is "true": the publish step then copies them to
# <plugin>/evals/ in the runner, and Tessl runs a publish-time eval that produces the registry Impact score and
# counts against the Tessl subscription. Without the variable the plugin is published without scenarios; run
# them yourself with `claude plugin eval` (docs/design/evals.md). Regenerate scenarios with
# `tessl scenario generate ./<plugin> --workspace ai-unified-process` and `tessl scenario download --last`,
# then move them to evals/<plugin>/ and commit.
#
# After the publish step, each plugin whose current version has no GitHub release yet gets one:
# tag <plugin>-v<version> on the commit that set the version, notes from
# scripts/release-notes.sh (the plugin's commits since the previous version). A run
# via workflow_dispatch creates any release that is still missing.
#
# One-time setup:
#   1. Create an API key in the Tessl Web UI (workspace settings → API keys).
#   2. Add it as a repo secret named TESSL_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret).
name: Publish to Tessl

on:
  push:
    branches: [main]
    paths:
      - 'aiup-core/**'
      - 'aiup-vaadin-jooq/**'
      - 'aiup-angular-jpa/**'
      - 'aiup-blazor-dotnet/**'
      - 'aiup-nestjs-nextjs/**'
      - 'aiup-flyway/**'
      - 'aiup-jooq/**'
      - 'aiup-jpa/**'
      - 'aiup-spring-boot/**'
      - 'aiup-vaadin/**'
      - 'aiup-angular/**'
      - 'aiup-playwright/**'
      - 'aiup-drizzle/**'
      - 'aiup-nestjs/**'
      - 'aiup-nextjs/**'
      - 'evals/**'
      - '.github/workflows/publish-tessl.yml'
  workflow_dispatch:

# One publishing run at a time: two pushes in quick succession would both pass the dry run, and the second
# `tessl plugin publish` or `gh release create` would then fail on the version the first one just published.
# A waiting run publishes whatever version is new when its turn comes, so nothing is lost when it replaces an
# older waiting run.
concurrency:
  group: publish-tessl
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    strategy:
      fail-fast: false
      matrix:
        plugin: [aiup-core, aiup-vaadin-jooq, aiup-angular-jpa, aiup-blazor-dotnet, aiup-nestjs-nextjs,
                 aiup-flyway, aiup-jooq, aiup-jpa, aiup-spring-boot, aiup-vaadin, aiup-angular, aiup-playwright,
                 aiup-drizzle, aiup-nestjs, aiup-nextjs]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # release notes need the plugin's history since its previous version

      - uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Rewrite marketplace-relative README links for the published package
        run: |
          bash scripts/rewrite-plugin-readme-links.sh \
            "${{ matrix.plugin }}" \
            "https://github.com/${{ github.repository }}" \
            "${{ github.sha }}"

      - name: Publish ${{ matrix.plugin }} if its version is new
        run: |
          set -euo pipefail
          dir="${{ matrix.plugin }}"

          # The scenarios live outside the plugin folder (see the header); Tessl reads them from <plugin>/evals/.
          # Published only on request: the publish-time eval counts against the Tessl subscription.
          if [ "${{ vars.TESSL_PUBLISH_EVALS }}" = "true" ] && [ -d "evals/$dir" ]; then
            cp -R "evals/$dir" "$dir/evals"
          fi

          # Dry-run gates the real publish:
          #   exit 0            -> version is new, publish it
          #   "already exists"  -> nothing to release, skip cleanly
          #   any other failure -> real error, fail the job
          set +e
          out=$(tessl plugin publish --dry-run "./$dir" 2>&1)
          code=$?
          set -e
          echo "$out"

          if [ "$code" -eq 0 ]; then
            echo "::notice::Publishing $dir"
            # With TESSL_PUBLISH_EVALS, publishes the committed evals/ scenarios
            # and runs a publish-time eval to attach the Impact score.
            tessl plugin publish "./$dir"
          elif echo "$out" | grep -q "already exists"; then
            echo "::notice::$dir version already published — skipping"
          else
            echo "::error::Pre-publish checks failed for $dir"
            exit 1
          fi

      - name: Create the GitHub release of ${{ matrix.plugin }} if it is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plugin="${{ matrix.plugin }}"
          read -r tag commit < <(scripts/release-notes.sh "$plugin" --tag)

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists — skipping"
            exit 0
          fi

          scripts/release-notes.sh "$plugin" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$commit" \
            --title "$plugin ${tag#"$plugin-v"}" --notes-file "$RUNNER_TEMP/notes.md"
